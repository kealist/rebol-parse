# Build and test on every push and pull request. Pushing a tag like v0.2.0 also publishes that version to
# nuget.org using trusted publishing, so no API key is stored in GitHub. See docs/Releasing.md for the one-time setup.
name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      # a tag v1.2.3 builds version 1.2.3; anything else is a throwaway pre-release
      - name: Work out the version
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=0.0.0-ci.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          fi

      - name: Test
        run: dotnet test -c Release --nologo

      - name: Pack
        run: dotnet pack src/RebolParse -c Release --nologo -o artifacts -p:Version=${{ steps.version.outputs.version }}

      - uses: actions/upload-artifact@v4
        with:
          name: package
          path: artifacts/*
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # lets the job ask GitHub for the token that nuget.org trusts
      contents: read
    environment: nuget   # the same name goes in the nuget.org policy; add required reviewers to it in GitHub to approve each release
    steps:
      # checkout first: it cleans the workspace, which would delete the downloaded package
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts

      - uses: actions/download-artifact@v4
        with:
          name: package
          path: artifacts

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      # swaps the job's GitHub identity token for a short-lived nuget.org API key (see the script for the steps)
      - name: Get a nuget.org API key
        id: login
        run: scripts/nuget-login.sh
        env:
          NUGET_USER: ${{ secrets.NUGET_USER }}   # your nuget.org profile name, not your email

      - name: Push
        run: |
          ls -l artifacts
          dotnet nuget push "artifacts/*.nupkg" --api-key "${{ steps.login.outputs.api_key }}" --source https://api.nuget.org/v3/index.json --skip-duplicate
